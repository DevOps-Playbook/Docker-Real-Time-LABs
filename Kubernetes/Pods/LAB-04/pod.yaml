apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-app
  labels:
    app: incident-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-app
  template:
    metadata:
      labels:
        app: incident-app
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=OK", "-listen=:5678"]
          envFrom:
            - configMapRef:
                name: app-config
