apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-app
  labels:
    app: incident-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-app
  template:
    metadata:
      labels:
        app: incident-app
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              # BUG: minikube's default node almost never has 4 full CPUs available,
              # so the scheduler can never place this pod.
              cpu: "4"
              memory: "128Mi"
            limits:
              cpu: "4"
              memory: "128Mi"
