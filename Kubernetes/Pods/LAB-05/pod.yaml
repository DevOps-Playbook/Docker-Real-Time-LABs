apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-app
  labels:
    app: incident-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-app
  template:
    metadata:
      labels:
        app: incident-app
    spec:
      containers:
        - name: memory-hog
          image: busybox:1.36
          command:
            - "sh"
            - "-c"
            - |
              a="x"
              while true; do
                a="$a$a$a$a"
                sleep 0.2
              done
          resources:
            requests:
              memory: "10Mi"
              cpu: "50m"
            limits:
              # BUG: far too low for what this (deliberately memory-hungry) process needs
              memory: "10Mi"
              cpu: "100m"
